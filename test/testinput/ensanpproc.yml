geometry:
  geom_grid_file: data_generated/gridgen/soca_gridspec.72x35x25.nc
  mom6_input_nml: data_static/72x35x25/input.nml
  fields metadata: data_static/fields_metadata.yml

nens: 4
nens per MPI task: 2

increment variables: &vars
- sea_water_potential_temperature
- sea_water_salinity
- sea_surface_height_above_geoid
- eastward_sea_water_velocity
- northward_sea_water_velocity
- ocean_mixed_layer_thickness
- sea_water_depth
- sea_ice_area_fraction
- sea_ice_thickness
- sea_ice_snow_thickness
- sea_water_cell_thickness

backgrounds:
  members from template:
    template:
      read_from_file: 1
      date: &date_bkg 2018-04-15T00:00:00Z
      basename: data_static/72x35x25/
      remap_filename: data_static/72x35x25/restarts/MOM.res.nc
      ocn_filename: restarts_ens/MOM.res.ens.%mem%.nc
      ice_filename: restarts_ens/cice.res.ens.%mem%.nc
      state variables: *vars
    pattern: %mem%
    nmembers: 4

ensemble mean output:
  datadir: data_output/
  exp: ensmean
  type: an
  date: *date_bkg

ensemble inflation:
  value: 1.5

recentering state:
  read_from_file: 1
  date: *date_bkg
  basename: data_static/72x35x25/
  ocn_filename: restarts/MOM.res.nc
  ice_filename: restarts/cice.res.nc
  state variables: *vars

output increments:
  datadir: data_output/
  exp: recentered_incr
  type: ens
  date: *date_bkg

increment postprocessing:
  set increment variables to zero:
  - eastward_sea_water_velocity
  - northward_sea_water_velocity
  change precision:
    variables:
    - sea_water_potential_temperature
    - sea_water_salinity
    - sea_ice_area_fraction
    - sea_ice_thickness
    - sea_ice_snow_thickness
    precision: 1.e-5 # precision is set pretty low for test reference comparison purpose only
  append vertical geometry:
    layers variable: sea_water_cell_thickness
    vertical geometry:
      date: *date_bkg
      basename: data_static/72x35x25/
      ocn_filename: restarts/MOM.res.nc
      read_from_file: 3

  # Attempt to keep the analysis within physical bounds
  # by applying QC to the increments before adding them to the background.
  bounds check:
    state bounds:
      sea_water_potential_temperature: [-2.5, 36.0]
      sea_water_salinity: [0.0, 44.0]

    absolute steric increment max: 0.5
    steric variable change:
      linear variable changes:
      - linear variable change name: BalanceSOCA

    stability check:
      increment stability iterations: 20
      min stable density gradient: 1e-4

    coastal increment filter:
      min distance: 0.0       # [m] zero increments at the coast
      max distance: 200000.0  # [m] full increments beyond 200 km from coast

analysis postprocessing:
  pattern: "%mem%"
  cice background state:
    read_from_file: 1
    basename: data_static/72x35x25/restarts/
    ice_filename: iced.2018-04-15-00000.nc
    ocn_filename: MOM.res.nc
    date: *date_bkg
    state variables:
    # per-category ice variables from the CICE restart
    - sea_ice_category1_area_fraction
    - sea_ice_category2_area_fraction
    - sea_ice_category3_area_fraction
    - sea_ice_category4_area_fraction
    - sea_ice_category5_area_fraction
    - sea_ice_category1_volume
