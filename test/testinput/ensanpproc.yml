    - sea_water_potential_temperature
    - sea_water_salinity
  postprocess ice:
    ncat: 5
    ice_lev: 7
    sno_lev: 1
    itd:
      rebin: true
      category bounds: [0.0, 0.6445072, 1.391433, 2.470179, 4.567288, 9.333887]
      min thickness gap: 0.01

  restart output:
    # per-member dirs are pre-created by the test harness (data_generated/ensanpproc/mem.N)
    datadir: data_generated/ensanpproc/mem.%mem%
    exp: ensanpproc
    type: an
    # update mode: preserve unmodelled CICE variables of the template
    cice template: data_static/72x35x25/restarts/iced.2018-04-15-00000.nc

test:
  reference filename: testref/ensanpproc.test
  test output filename: testoutput/ensanpproc.test
  float absolute tolerance: 1e-4
