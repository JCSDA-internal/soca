# ensanpproc with the increment QC freezing-point floor as the only QC stage,
# so its effect on the T increments is not mixed with other stages. Without
# the background check (min background excess: 0) the floor raises 300+380
# points on the two members logged by task 0; with the 1 K check below it
# raises 62+84, so both branches of the floor are exercised. (Production uses
# min background excess: 5, which raises nothing on this small case.)
# PostProcessIce `max sst for ice` is tested in soca2cice_new_maxsst, since
# this app does not send the postprocessed ice to the test log.
geometry:
  geom_grid_file: data_generated/gridgen/soca_gridspec.72x35x25.nc
  mom6_input_nml: data_static/72x35x25/input.nml
  fields metadata: data_static/fields_metadata.yml

nens: 4
nens per MPI task: 2

increment variables: &vars
- sea_water_potential_temperature
- sea_water_salinity
- sea_surface_height_above_geoid
- sea_ice_area_fraction
- sea_ice_thickness
- sea_ice_snow_thickness
- sea_water_cell_thickness

backgrounds:
  members from template:
    template:
      read_from_file: 1
      date: &date_bkg 2018-04-15T00:00:00Z
      basename: data_static/72x35x25/
      remap_filename: data_static/72x35x25/restarts/MOM.res.nc
      ocn_filename: restarts_ens/MOM.res.ens.%mem%.nc
      ice_filename: restarts_ens/cice.res.ens.%mem%.nc
      state variables: *vars
    pattern: %mem%
    nmembers: 4

ensemble inflation:
  value: 1.5

recentering state:
  read_from_file: 1
  date: *date_bkg
  basename: data_static/72x35x25/
  ocn_filename: restarts/MOM.res.nc
  ice_filename: restarts/cice.res.nc
  state variables: *vars

output increments:
  datadir: data_output/
  exp: recentered_incr
  type: ens
  date: *date_bkg

increment postprocessing:
  bounds check:
    freezing point floor:
      open water margin: 1.0
      min background excess: 1.0

test:
  reference filename: testref/ensanpproc_guards.test
  test output filename: testoutput/ensanpproc_guards.test
  float absolute tolerance: 1e-4
