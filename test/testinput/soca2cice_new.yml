geometry: &geom
  geom_grid_file: data_generated/gridgen/soca_gridspec.72x35x25.nc
  mom6_input_nml: data_static/72x35x25/input.nml
  fields metadata: data_static/fields_metadata.yml

restart:
  read_from_file: 1
  basename: data_static/72x35x25/restarts/
  ice_filename: iced.2018-04-15-00000.nc
  ocn_filename: MOM.res.nc 
  date: 2018-04-15T00:00:00Z
  state variables:
   # ice category variables
  - sea_ice_category1_area_fraction
  - sea_ice_category2_area_fraction
  - sea_ice_category3_area_fraction
  - sea_ice_category4_area_fraction
  - sea_ice_category5_area_fraction
  - sea_ice_category1_volume
  - sea_ice_category2_volume
  - sea_ice_category3_volume
  - sea_ice_category4_volume
  - sea_ice_category5_volume
  - sea_ice_snow_category1_volume
  - sea_ice_snow_category2_volume
  - sea_ice_snow_category3_volume
  - sea_ice_snow_category4_volume
  - sea_ice_snow_category5_volume
    # ocean variables
  - sea_water_potential_temperature
  - sea_water_salinity

restart output:
  datadir: data_output
  exp: cice_restart_postproc
  type: an

analysis:
  read_from_file: 1
  basename: data_generated/3dvar/
  ocn_filename: ocn.3dvar.an.2018-04-15T00:00:00Z.nc
  ice_filename: ice.3dvar.an.2018-04-15T00:00:00Z.nc
  date: 2018-04-15T00:00:00Z
  state variables:
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_water_cell_thickness
  - sea_ice_area_fraction
  - sea_ice_thickness
  - sea_ice_snow_thickness

postprocess ice:
  ncat: 5
  ice_lev: 7
  sno_lev: 1
  cice restart:
    input:  data_static/72x35x25/restarts/iced.2018-04-15-00000.nc
    output: data_output/iced.postproc.nc
  arctic:
    rescale prior:
      rescale: true
      min hice: 0.5
      min hsno: 0.1
  antarctic:
    seaice edge: 0.15
    shuffle: true
    rescale prior:
      rescale: true
      min hice: 0.5
      min hsno: 0.1

test:
  reference filename: testref/soca2cice_new.test
  test output filename: testoutput/soca2cice_new.test
  float relative tolerance: 1e-4
