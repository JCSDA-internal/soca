geometry: &geom
  geom_grid_file: data_generated/gridgen/soca_gridspec.72x35x25.nc
  mom6_input_nml: data_static/72x35x25/input.nml
  fields metadata: data_static/fields_metadata.yml

# DA background -- aggregate ice + ocean (history-style ice file).
background:
  read_from_file: 1
  basename: data_static/72x35x25/restarts/
  ocn_filename: MOM.res.nc
  ice_filename: cice.res.nc
  date: &bkg_date 2018-04-15T00:00:00Z
  state variables: &bg_vars
  - sea_ice_area_fraction
  - sea_ice_thickness
  - sea_ice_snow_thickness
  - sea_water_potential_temperature
  - sea_water_salinity

# 3DVar increment.  Read using bg's variables / time inside Postproc.h.
increment:
  date: *bkg_date
  basename: data_generated/3dvar/
  ocn_filename: ocn.3dvar.iter1.incr.2018-04-15T00:00:00Z.nc
  ice_filename: ice.3dvar.iter1.incr.2018-04-15T00:00:00Z.nc

postprocess ice:
  ncat: 5
  ice_lev: 7
  sno_lev: 1
  cice restart:
    input:  data_static/72x35x25/restarts/iced.2018-04-15-00000.nc
    # Output filename matches the previous test layout so the
    # postprocice_vs_soca2cice regression nccmp picks it up unchanged.
    output: data_output/ice.cice_restart_postproc.an.2018-04-15T00:00:00Z.nc

test:
  reference filename: testref/soca2cice_new.test
  test output filename: testoutput/soca2cice_new.test
  float relative tolerance: 1e-4
